syntax = "proto3";

package io.kartographer.daemon;

option java_multiple_files = true;
option java_package = "io.kartographer.daemon.proto";

service KartographerDaemon {
  // Query daemon info and capabilities
  rpc GetWorkerInfo (WorkerInfoRequest) returns (WorkerInfoResponse);

  // Execute a single already-resolved task. This is the remote-worker path: the caller has
  // its own copy of the pipeline and places one task on this host.
  rpc ExecuteTask (ExecuteTaskRequest) returns (ExecuteTaskResponse);

  // Liveness and version handshake. The CLI restarts a daemon whose version does not match
  // its own, so a rebuilt CLI never talks to a daemon holding old task code.
  rpc GetDaemonInfo (DaemonInfoRequest) returns (DaemonInfoResponse);

  // The loaded pipeline's node metadata. Backs `karto tasks`, `karto graph` and
  // `karto run <task> --help` from one cached load.
  rpc DescribeProject (DescribeProjectRequest) returns (DescribeProjectResponse);

  // Shell tab completion, answered from the cached pipeline.
  rpc Complete (CompleteRequest) returns (CompleteResponse);

  // Run a task and its dependencies here. Bidirectional so execution events stream out while
  // answers to interactive prompts stream back.
  rpc RunPipeline (stream RunClientMessage) returns (stream RunServerMessage);

  // Ask the daemon to exit once in-flight runs finish.
  rpc Shutdown (ShutdownRequest) returns (ShutdownResponse);

  // Query running and recent runs, task states, and live outputs.
  rpc QueryRuns (QueryRunsRequest) returns (QueryRunsResponse);
}

message WorkerInfoRequest {}

message WorkerInfoResponse {
  string worker_id = 1;
  map<string, string> labels = 2;
  repeated string capabilities = 3;
}

message ExecuteTaskRequest {
  string task_type = 1;       // e.g. "io.kartographer.tasks.go.GoBuild"
  string task_name = 2;       // e.g. "build tileserver"
  string run_id = 3;          // Unique identifier for the pipeline run (used to group logs)

  // Serialized task properties
  map<string, string> properties = 4;

  // Inputs & Outputs
  repeated string input_files = 5;
  repeated string input_dirs = 6;
  repeated string output_files = 7;
  repeated string output_dirs = 8;

  string project_dir = 9;
  map<string, string> environment = 10;
  bool dry_run = 11;
  string input_set_json = 12;
  string invocation_id = 13;
  TaskLifecycle lifecycle = 14;
}

message ExecuteTaskResponse {
  enum Status {
    SUCCESS = 0;
    FAILURE = 1;
    UP_TO_DATE = 2;
  }
  Status status = 1;
  string error_message = 2;
  int32 exit_code = 3;
  string log_path = 4;        // Path to the log file on the daemon host
  string output_set_json = 5;
}

// ---------------------------------------------------------------------------
// Project-scoped requests
// ---------------------------------------------------------------------------

// Everything the daemon needs to identify and load the caller's pipeline.
message ProjectContext {
  string project_dir = 1;             // Absolute, resolved by the client
  string pipeline = 2;                // Optional -p/--pipeline override; .kts path or class name

  // The client's environment, not the daemon's. A daemon inherits the environment of
  // whatever started it, which is rarely the shell the user is typing in.
  map<string, string> environment = 3;

  // Whether the user actually passed -d/--project-dir. When false, a `project { rootDirectory }`
  // declared by the pipeline is allowed to redirect execution, matching local CLI behaviour.
  bool project_dir_explicit = 4;
}

enum RunStatus {
  RUN_SUCCESS = 0;
  RUN_FAILURE = 1;
  RUN_UP_TO_DATE = 2;
  RUN_CANCELLED = 3;
}

enum TaskLifecycle {
  TASK_FINITE = 0;
  TASK_SERVICE = 1;
}

enum DependencyCondition {
  DEPENDENCY_COMPLETED = 0;
  DEPENDENCY_READY = 1;
}

enum TaskExecutionState {
  TASK_QUEUED = 0;
  TASK_RUNNING = 1;
  TASK_READY = 2;
  TASK_STOPPED = 3;
  TASK_COMPLETED = 4;
  TASK_FAILED = 5;
}

message PropertyInfo {
  string name = 1;                       // Declaring field name
  string cli_name = 2;                   // --<cli_name>, empty when the property has no flag
  string description = 3;
  string type_name = 4;                  // Simple name of the property's value type
  repeated string literal_completions = 5;
  bool has_dynamic_completions = 6;      // Values require a Complete call to enumerate
}

message NodeInfo {
  string name = 1;                       // Fully qualified node name
  string type = 2;                       // Node class simple name
  repeated string dependencies = 3;      // As declared, before resolution
  repeated PropertyInfo properties = 4;
  bool is_task = 5;
  bool requires_elevation = 6;
  bool always_runs = 7;                  // No cacheable result; runs on every invocation
  TaskLifecycle lifecycle = 8;
}

// A node with its dependencies resolved through the DAG, for `karto graph`.
message ResolvedDependency {
  string invocation_id = 1;
  string display_name = 2;
  DependencyCondition condition = 3;
}

message ResolvedNode {
  string name = 1;
  repeated ResolvedDependency dependencies = 2;
  string invocation_id = 3;
  string display_name = 4;
  TaskLifecycle lifecycle = 5;
}

message DescribeProjectRequest {
  ProjectContext context = 1;
}

message DescribeProjectResponse {
  repeated NodeInfo nodes = 1;
  repeated ResolvedNode graph = 2;
  // Set when dependency resolution failed (cycle or missing dependency). `tasks` still
  // renders in that case; `graph` reports the error, as it does today.
  string graph_error = 3;
  string project_root = 4;
}

message CompleteRequest {
  ProjectContext context = 1;
  repeated string words = 2;             // COMP_WORDS
  int32 cword = 3;                       // COMP_CWORD
}

message CompleteResponse {
  repeated string candidates = 1;
}

// ---------------------------------------------------------------------------
// Pipeline execution
// ---------------------------------------------------------------------------

message RunStart {
  ProjectContext context = 1;
  string task_name = 2;
  map<string, string> properties = 3;    // Raw -P values; the daemon coerces to declared types
  bool dry_run = 4;
}

message PromptResponse {
  string request_id = 1;
  string value = 2;
}

message StdinData {
  string data = 1;
}

message RunCancel {}

message RunClientMessage {
  oneof message {
    RunStart start = 1;
    PromptResponse prompt_response = 2;
    RunCancel cancel = 3;
    StdinData stdin_data = 4;
  }
}

message PipelineStarted {
  int32 total_tasks = 1;
  repeated ResolvedNode graph = 2;
}

message TaskQueued { string task = 1; string invocation_id = 2; }

message TaskStarted { string task = 1; string invocation_id = 2; }

message TaskOutput {
  string task = 1;
  string line = 2;
  bool is_error = 3;
  string invocation_id = 4;
}

message TaskCompleted {
  string task = 1;
  RunStatus status = 2;
  string error_message = 3;
  int32 exit_code = 4;
  map<string, string> outputs = 5;       // Task.collectOutputs(), secrets already masked
  string invocation_id = 6;
}

message TaskOutputProduced {
  string task = 1;
  string name = 2;
  string value = 3;
  bool is_secret = 4;
  string invocation_id = 5;
}

message TaskReady {
  string task = 1;
  map<string, string> outputs = 2;
  string invocation_id = 3;
}

message TaskStopped {
  string task = 1;
  map<string, string> outputs = 2;
  string invocation_id = 3;
}

enum PromptKind {
  PROMPT_GENERIC = 0;
  // The pre-run sudo prompt. Carries `elevated_tasks` so the CLI can print the same banner
  // it prints today before asking for a password.
  PROMPT_SUDO_PASSWORD = 1;
}

message PromptRequested {
  string request_id = 1;
  string task = 2;                       // Empty for pipeline-level prompts
  string message = 3;
  bool secret = 4;
  PromptKind kind = 5;
  repeated string elevated_tasks = 6;
  string invocation_id = 7;
}

message PipelineCompleted {
  RunStatus status = 1;
  string error_message = 2;
  int32 exit_code = 3;
}

// The run could not start at all — pipeline failed to load, unknown task, bad property.
message RunError {
  string message = 1;
  int32 exit_code = 2;
}

message RunServerMessage {
  oneof message {
    PipelineStarted pipeline_started = 1;
    TaskQueued task_queued = 2;
    TaskStarted task_started = 3;
    TaskOutput task_output = 4;
    TaskCompleted task_completed = 5;
    PromptRequested prompt_requested = 6;
    PipelineCompleted pipeline_completed = 7;
    RunError error = 8;
    TaskOutputProduced task_output_produced = 9;
    TaskReady task_ready = 10;
    TaskStopped task_stopped = 11;
  }
}

// ---------------------------------------------------------------------------
// Run Inspection & Querying
// ---------------------------------------------------------------------------

message QueryRunsRequest {
  string project_dir = 1;             // Optional filter by project directory
  bool active_only = 2;               // If true, returns only currently active runs
}

message TaskExecutionInfo {
  string task_name = 1;
  TaskExecutionState state = 2;
  int64 started_at_millis = 3;
  int64 completed_at_millis = 4;
  map<string, string> outputs = 5;
  string error_message = 6;
  string invocation_id = 7;
}

message RunInfo {
  string run_id = 1;
  string project_dir = 2;
  string target_task = 3;
  string state = 4;                  // "RUNNING", "COMPLETED", "FAILED", "CANCELLED"
  int64 started_at_millis = 5;
  int64 completed_at_millis = 6;
  repeated TaskExecutionInfo tasks = 7;
}

message QueryRunsResponse {
  repeated RunInfo runs = 1;
}

// ---------------------------------------------------------------------------
// Lifecycle
// ---------------------------------------------------------------------------

message DaemonInfoRequest {}

message DaemonInfoResponse {
  string version = 1;                    // Build version; mismatch triggers a CLI-side restart
  int64 pid = 2;
  int32 active_runs = 3;
  int32 cached_projects = 4;
  int64 uptime_millis = 5;
}

message ShutdownRequest {}

message ShutdownResponse {
  bool accepted = 1;
}

// ---------------------------------------------------------------------------
// Local protocol
// ---------------------------------------------------------------------------
//
// The CLI does not speak gRPC. Bringing up a gRPC/Netty channel costs ~630 ms in a
// freshly started JVM — Netty's epoll native load alone is ~276 ms — which dwarfs the
// ~23 ms the daemon needs to answer from cache and defeats the point of having a daemon.
//
// So locally these same messages travel as length-prefixed frames over a plain JDK Unix
// socket: a 4-byte big-endian length followed by a serialized envelope. That path costs
// ~60 ms. gRPC is still how genuinely remote workers are reached over TCP.
//
// One connection is one conversation. Unary calls are request-then-response; a run sends
// RunClientMessage frames and receives RunServerMessage frames until the pipeline
// completes or errors.

message LocalRequest {
  oneof request {
    DaemonInfoRequest daemon_info = 1;
    DescribeProjectRequest describe_project = 2;
    CompleteRequest complete = 3;
    RunClientMessage run = 4;
    ShutdownRequest shutdown = 5;
    QueryRunsRequest query_runs = 6;
  }
}

message LocalError {
  string message = 1;
  int32 code = 2;
}

message LocalResponse {
  oneof response {
    DaemonInfoResponse daemon_info = 1;
    DescribeProjectResponse describe_project = 2;
    CompleteResponse complete = 3;
    RunServerMessage run = 4;
    ShutdownResponse shutdown = 5;
    LocalError error = 6;
    QueryRunsResponse query_runs = 7;
  }
}
