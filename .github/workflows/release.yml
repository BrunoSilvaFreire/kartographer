name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build the distribution
        run: ./gradlew :dist:distZip :dist:distTar -Pversion=${{ steps.version.outputs.value }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/build/distributions/kartographer-${{ steps.version.outputs.value }}.zip" \
            "dist/build/distributions/kartographer-${{ steps.version.outputs.value }}.tar.gz" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
