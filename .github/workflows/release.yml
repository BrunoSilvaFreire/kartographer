name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build bundle and Debian package
        run: ./gradlew :dist:distZip :dist:distTar :dist:packageDeb -Pversion=${{ steps.version.outputs.value }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            dist/build/distributions/*.zip
            dist/build/distributions/*.tar.gz
            dist/build/distributions/*.deb

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from the tag
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build Windows MSI
        shell: bash
        run: ./gradlew :dist:packageMsi -Pversion=${{ steps.version.outputs.value }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/build/distributions/*.msi

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # `gh release create --generate-notes` shells out to git, so it needs a checkout.
      - uses: actions/checkout@v4

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
